name: Apply DSH service OAuth patch

on:
  push:
    branches:
      - fix/dsh-service-oauth-20260812
    paths:
      - scripts/patch-dsh-service-oauth.cjs
      - .github/workflows/apply-dsh-service-oauth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dsh-service-oauth-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply patch
        run: node scripts/patch-dsh-service-oauth.cjs
      - name: Validate
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated patch
        run: |
          rm scripts/patch-dsh-service-oauth.cjs .github/workflows/apply-dsh-service-oauth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts tests/oauth-serviceinfo-contract.test.cjs scripts/patch-dsh-service-oauth.cjs .github/workflows/apply-dsh-service-oauth.yml
          git commit -m "Authorize DSH service calls with SPMT OAuth"
          git push origin HEAD:fix/dsh-service-oauth-20260812
