name: Apply SPMT dual XP wallet

on:
  push:
    branches:
      - fix/spmt-dual-xp-wallet
    paths:
      - scripts/patch-spmt-dual-wallet.mjs
      - .github/workflows/apply-spmt-dual-wallet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/spmt-dual-xp-wallet
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-spmt-dual-wallet.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit validated wallet changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts
          git commit -m "Add spendable and lifetime SPMT XP wallets"
          git push origin HEAD:fix/spmt-dual-xp-wallet
