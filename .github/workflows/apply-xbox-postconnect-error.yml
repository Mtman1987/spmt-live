name: Apply Xbox post-connect error fix

on:
  push:
    branches:
      - fix/xbox-worker-postconnect-error-20260812
    paths:
      - ".github/workflows/apply-xbox-postconnect-error.yml"
      - "tests/xbox-worker-cdp-resilience.test.cjs"
      - "scripts/patch-xbox-postconnect-error.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/xbox-worker-postconnect-error-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply persistent CDP error handler
        run: python scripts/patch-xbox-postconnect-error.py
      - name: Validate Xbox resilience and full SPMT app
        run: |
          npm ci --no-audit --no-fund
          npm run test:xbox-worker-resilience
          npm test
      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/apply-xbox-postconnect-error.yml scripts/patch-xbox-postconnect-error.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle post-connect Xbox CDP socket errors"
          git push origin HEAD:fix/xbox-worker-postconnect-error-20260812
