name: Apply XP client credentials security fix

on:
  push:
    branches:
      - fix/xp-client-credentials-20260812
    paths:
      - ".github/workflows/apply-xp-client-credentials.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/xp-client-credentials-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply client-credentials patch
        run: python scripts/patch-xp-client-credentials.py
      - name: Validate security contract and application
        run: |
          npm ci --no-audit --no-fund
          node --test tests/oauth-client-credentials-contract.test.cjs
          npm run typecheck
          npm run build
      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/apply-xp-client-credentials.yml scripts/patch-xp-client-credentials.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use OAuth client credentials for platform XP writes"
          git push origin HEAD:fix/xp-client-credentials-20260812
