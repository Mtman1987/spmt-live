name: Apply XP OAuth service-token separation

on:
  push:
    branches:
      - fix/xp-oauth-service-token-20260812
    paths:
      - ".github/workflows/apply-xp-oauth-service-token.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/xp-oauth-service-token-20260812
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply OAuth separation patch
        run: python scripts/patch-xp-oauth-service-token.py
      - name: Validate security contracts and full app
        run: |
          npm ci --no-audit --no-fund
          npm run test:platform-oauth
          npm test
      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/apply-xp-oauth-service-token.yml scripts/patch-xp-oauth-service-token.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate user OAuth from XP service credentials"
          git push origin HEAD:fix/xp-oauth-service-token-20260812
