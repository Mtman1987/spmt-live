name: Deploy SPMT developer portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-spmt-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spmt-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload existing SPMT frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish SPMT frontend
        id: deployment
        uses: actions/deploy-pages@v4
