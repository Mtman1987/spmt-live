name: Emergency SPMT machine recovery

on:
  push:
    branches: [ops/recover-spmt-machine]

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect destroyed SPMT app machine
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect destroyed machine as JSON
        continue-on-error: true
        run: timeout 20s flyctl machine status 48ee053be53478 --app spmt-live --json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: List current machines
        continue-on-error: true
        run: timeout 20s flyctl machines list --app spmt-live --json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: List release history
        continue-on-error: true
        run: timeout 20s flyctl releases --app spmt-live --json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Capture destroyed instance logs
        continue-on-error: true
        run: timeout 20s flyctl logs --app spmt-live --instance 48ee053be53478 --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Inspect persistent volume
        continue-on-error: true
        run: timeout 20s flyctl volume show vol_vde2p30e6xo8d0k4 --app spmt-live
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
