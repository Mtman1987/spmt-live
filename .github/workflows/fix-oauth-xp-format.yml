name: Fix OAuth XP formatting

on:
  push:
    branches:
      - fix/oauth-xp-bearer-20260812
    paths:
      - ".github/workflows/fix-oauth-xp-format.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/oauth-xp-bearer-20260812
          fetch-depth: 0
      - name: Fix generated indentation
        run: python scripts/fix-oauth-xp-format.py
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/fix-oauth-xp-format.yml scripts/fix-oauth-xp-format.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up OAuth platform auth block"
          git push origin HEAD:fix/oauth-xp-bearer-20260812
