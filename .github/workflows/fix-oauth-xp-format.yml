name: Fix OAuth XP formatting

on:
  push:
    branches:
      - fix/oauth-xp-bearer-20260812
    paths:
      - ".github/workflows/fix-oauth-xp-format.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/oauth-xp-bearer-20260812
          fetch-depth: 0
      - name: Fix generated indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server.ts')
          text = path.read_text()
          old = '''        if (appId && userId) {
if (!scopes.includes(requiredScope)) {
  return res.status(403).json({ error: `Missing required scope: ${requiredScope}` });
}
req.user = payload;
req.platformKey = {
  id: null,
  userId,
  appId,
  name: `OAuth ${appId}`,
  keyPrefix: null,
  scopes,
  oauth: true,
};
return next();
        }'''
          new = '''        if (appId && userId) {
          if (!scopes.includes(requiredScope)) {
            return res.status(403).json({ error: `Missing required scope: ${requiredScope}` });
          }
          req.user = payload;
          req.platformKey = {
            id: null,
            userId,
            appId,
            name: `OAuth ${appId}`,
            keyPrefix: null,
            scopes,
            oauth: true,
          };
          return next();
        }'''
          if old not in text:
              raise SystemExit('malformed generated OAuth block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-oauth-xp-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up OAuth platform auth block"
          git push origin HEAD:fix/oauth-xp-bearer-20260812
