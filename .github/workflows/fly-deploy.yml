name: Deploy to Fly.io

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-housekeeping:
    name: Retain newest merged branch backup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older branches already contained in main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const merged = [];
            for (const branch of branches) {
              if (!branch?.name || branch.name === defaultBranch) continue;
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: branch.name, head: defaultBranch,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.notice(`Retaining unmerged branch ${branch.name}.`);
                continue;
              }
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: branch.commit.sha });
              const date = commit.data.commit.committer?.date || commit.data.commit.author?.date || '1970-01-01T00:00:00Z';
              merged.push({ name: branch.name, sha: branch.commit.sha, date });
            }
            merged.sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
            const newest = merged[0];
            if (newest) core.notice(`Keeping newest merged branch backup ${newest.name} (${newest.sha}).`);
            for (const branch of merged.slice(1)) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                core.notice(`Deleted older merged branch ${branch.name}.`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning(`Could not delete ${branch.name}; it may be protected or already absent.`);
                  continue;
                }
                throw error;
              }
            }
  deploy:
    needs: branch-housekeeping
    name: Deploy spmt-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure persistent volume has headroom
        run: |
          set -euo pipefail
          flyctl volumes list --app spmt-live --json > /tmp/spmt-volumes.json
          node <<'NODE' > /tmp/spmt-data-volumes.txt
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/spmt-volumes.json', 'utf8'));
          const volumes = Array.isArray(payload) ? payload : Array.isArray(payload?.volumes) ? payload.volumes : [];
          const matches = volumes.filter((volume) => String(volume?.name || '') === 'spmt_data');
          if (!matches.length) {
            console.error('No spmt_data Fly volume found');
            process.exit(2);
          }
          for (const volume of matches) {
            const id = String(volume?.id || '').trim();
            const size = Number(volume?.size_gb ?? volume?.sizeGb ?? volume?.size ?? 0);
            if (!id) continue;
            process.stdout.write(`${id} ${Number.isFinite(size) ? size : 0}\n`);
          }
          NODE
          while read -r volume_id current_size; do
            echo "SPMT volume ${volume_id} currently ${current_size} GB"
            if awk "BEGIN { exit !(${current_size} < 5) }"; then
              echo "Extending ${volume_id} to 5 GB before deployment"
              flyctl volumes extend "${volume_id}" --app spmt-live --size 5 --yes
            fi
          done < /tmp/spmt-data-volumes.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Validate production contracts
        run: npm ci && npm test
      - name: Deploy to Fly.io
        run: flyctl deploy . --remote-only --config fly.toml --build-arg BUILD_SHA=${GITHUB_SHA} --build-arg GITHUB_SHA=${GITHUB_SHA} --build-arg GH_SHA=${GITHUB_SHA} --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live OAuth database writes
        run: |
          node <<'NODE'
          const endpoint = 'https://spmt.live/api/health/oauth';
          const attempts = 12;
          const delayMs = 5000;

          async function sleep(ms) {
            await new Promise((resolve) => setTimeout(resolve, ms));
          }

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const response = await fetch(endpoint, {
                headers: { Accept: 'application/json' },
                signal: AbortSignal.timeout(8000),
              });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch {}
              console.log(`OAuth live probe ${attempt}/${attempts}: HTTP ${response.status}`, body || text);
              if (response.ok && body?.status === 'ready' && body?.authorizationCodeWrite === 'ok') {
                console.log('Live SPMT OAuth database write probe passed.');
                process.exit(0);
              }
            } catch (error) {
              console.warn(`OAuth live probe ${attempt}/${attempts} failed:`, error?.message || error);
            }
            if (attempt < attempts) await sleep(delayMs);
          }

          console.error('Live SPMT OAuth database write probe did not become healthy after deploy.');
          process.exit(1);
          NODE
      - name: Verify public authenticated OAuth routes
        run: flyctl ssh console --app spmt-live --process-group app --command "/bin/sh -lc 'SPMT_OAUTH_SELFTEST_BASE_URL=https://spmt.live node /app/scripts/operations/oauth-live-selftest.cjs'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
