name: Run dual XP wallet porter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-dual-xp-porter.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/spmt-dual-xp-wallet
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-spmt-dual-wallet.mjs
      - run: node scripts/patch-spmt-gamble-wallet.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts
          if git diff --cached --quiet; then
            echo "No wallet changes to commit"
          else
            git commit -m "Add spendable, lifetime, and gambling XP wallets"
            git push origin HEAD:fix/spmt-dual-xp-wallet
          fi
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view fix/spmt-dual-xp-wallet --json number >/dev/null 2>&1 || gh pr create --base main --head fix/spmt-dual-xp-wallet --title "Add spendable and lifetime SPMT XP wallets" --body "Adds separate spendable and lifetime XP, lifetime-based ranks, atomic spend and transfer endpoints, a canonical XP leaderboard, and atomic gambling settlement. Gambling refills spendable XP to lifetime at 1:1, then compresses overflow 10:1 and splits the compressed growth evenly so spendable never exceeds lifetime. Build validated before PR creation."
