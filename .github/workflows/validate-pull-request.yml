name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Parse Fly configuration without production credentials
        run: python3 -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('fly.toml').read_text())"
      - name: Install and validate
        run: npm ci && npm test
