name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate Fly process and health-check configuration
        run: flyctl config validate --config fly.toml
      - name: Install and validate
        run: npm ci && npm test
