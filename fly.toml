app = "spmt-live"
primary_region = "lax"

[build]

[processes]
  app = "node start.cjs"
  xbox = "node xbox-worker-guard.cjs"

[env]
  CODEX_WORKER_URL = "https://mtman-machine-rotator.fly.dev"
  CODEX_REPAIR_DASHBOARD_URL = "https://mtman-machine-rotator.fly.dev/"
  CLOUD_XBOX_WORKER_URL = "http://xbox.process.spmt-live.internal:3003"
  CLOUD_XBOX_WORKER_PORT = "3003"
  CLOUD_XBOX_MAX_SESSIONS = "1"
  CLOUD_XBOX_PROFILE_ROOT = "/var/lib/spmt-xbox/profiles"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health/ready"
  timeout = "5s"

[[mounts]]
  source = "spmt_data"
  destination = "/data"
  initial_size = "5GB"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
  processes = ["xbox"]
