<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpaceMountain Program Output</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #program{position:fixed;inset:0;overflow:hidden;background:transparent}
    #overlay-runtime{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none;opacity:0}
    #status{position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:min(680px,calc(100vw - 24px));padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.78);color:#cbd5e1;font:700 11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:0;transition:opacity .18s ease;pointer-events:none}
    #status.show{opacity:1}
    #status.error{color:#fecaca;background:rgba(69,10,10,.9)}
  </style>
</head>
<body>
  <div id="program">
    <iframe id="overlay-runtime" title="Saved Overlay Bay program" src="/embed/overlays?mode=overlay&app=broadcast-safe"></iframe>
  </div>
  <div id="status"></div>

  <script>
    (() => {
      'use strict';

      // IMPORTANT INVARIANT:
      // Every source, INCLUDING Xbox, lives inside the same saved Overlay Bay runtime DOM.
      // We never put Xbox below/above the runtime iframe as a separate layer. The saved widget
      // zIndex therefore remains the single source of truth for the final program output.
      // The program page itself is transparent so disabled/deleted sources reveal whatever the
      // broadcaster has underneath this browser source.

      const overlayRuntime = document.getElementById('overlay-runtime');
      const status = document.getElementById('status');
      let layoutSignature = '';
      let latestLayout = { enabled: true, widgets: [] };
      let frameBusy = false;
      let authenticated = true;
      let statusTimer = null;
      let lastObjectUrl = '';
      let xboxSessionRunning = false;
      let xboxStatusKnown = false;

      function authHeaders() {
        const token = localStorage.getItem('spmt_token') || '';
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      function showStatus(message, error = false, holdMs = 3500) {
        clearTimeout(statusTimer);
        status.textContent = String(message || '');
        status.className = `show${error ? ' error' : ''}`;
        if (holdMs > 0) statusTimer = setTimeout(() => { status.className = ''; }, holdMs);
      }

      async function getJson(path) {
        const response = await fetch(path, {
          credentials: 'include',
          cache: 'no-store',
          headers: { Accept: 'application/json', ...authHeaders() },
        });
        if (response.status === 401) {
          authenticated = false;
          throw new Error('SPMT sign-in is required in this browser before this program URL can load the saved scene.');
        }
        authenticated = true;
        if (!response.ok) {
          let message = `Request failed (${response.status})`;
          try { message = (await response.json()).error || message; } catch {}
          throw new Error(message);
        }
        return await response.json();
      }

      function savedXboxWidget() {
        if (latestLayout?.enabled === false || !Array.isArray(latestLayout?.widgets)) return null;
        return latestLayout.widgets.find((item) => item && item.kind === 'xbox' && item.visible !== false) || null;
      }

      function runtimeXboxWidget() {
        try {
          return overlayRuntime.contentDocument?.querySelector('.overlay-widget.kind-xbox') || null;
        } catch {
          return null;
        }
      }

      function installProgramTransparency() {
        try {
          const doc = overlayRuntime.contentDocument;
          if (!doc) return;
          let style = doc.getElementById('broadcast-safe-program-transparency');
          if (!style) {
            style = doc.createElement('style');
            style.id = 'broadcast-safe-program-transparency';
            style.textContent = 'html,body,.surface-shell,#surface-content,.obv2-manager,#overlay-canvas{background:transparent!important;background-color:transparent!important;}';
            doc.head.appendChild(style);
          }
        } catch {}
      }

      function applyXboxRuntimeVisibility() {
        const xboxWidget = runtimeXboxWidget();
        if (!xboxWidget) return;
        const shouldDraw = Boolean(savedXboxWidget()) && xboxStatusKnown && xboxSessionRunning;
        xboxWidget.style.visibility = shouldDraw ? '' : 'hidden';
      }

      function clearXboxFrame() {
        try {
          const image = overlayRuntime.contentDocument?.querySelector('[data-broadcast-safe-xbox-frame]');
          if (image) image.removeAttribute('src');
        } catch {}
        if (lastObjectUrl) {
          URL.revokeObjectURL(lastObjectUrl);
          lastObjectUrl = '';
        }
      }

      function installXboxFrameIntoSavedWidget() {
        try {
          const doc = overlayRuntime.contentDocument;
          if (!doc) return false;
          installProgramTransparency();

          const xboxWidget = doc.querySelector('.overlay-widget.kind-xbox');
          if (!xboxWidget) return false;

          const sourceBody = xboxWidget.querySelector('.obv2-source-body');
          if (!sourceBody) return false;

          let image = sourceBody.querySelector('[data-broadcast-safe-xbox-frame]');
          if (!image) {
            sourceBody.replaceChildren();
            image = doc.createElement('img');
            image.setAttribute('data-broadcast-safe-xbox-frame', '');
            image.alt = 'Xbox program video';
            image.style.cssText = 'display:block;width:100%;height:100%;background:transparent;user-select:none;-webkit-user-drag:none;';
            sourceBody.appendChild(image);
          }

          const saved = savedXboxWidget();
          image.style.objectFit = saved?.fit === 'cover' ? 'cover' : 'contain';
          applyXboxRuntimeVisibility();
          return true;
        } catch {
          return false;
        }
      }

      function revealRuntimeWhenReady() {
        installProgramTransparency();
        installXboxFrameIntoSavedWidget();
        overlayRuntime.style.opacity = '1';
      }

      async function refreshLayout(initial = false) {
        try {
          const data = await getJson('/api/overlay-workspace');
          const layout = data?.layout || { enabled: true, widgets: [] };
          const signature = JSON.stringify(layout);
          latestLayout = layout;

          if (!initial && layoutSignature && signature !== layoutSignature) {
            overlayRuntime.style.opacity = '0';
            overlayRuntime.src = `/embed/overlays?mode=overlay&app=broadcast-safe&rev=${Date.now()}`;
          } else {
            installXboxFrameIntoSavedWidget();
          }

          layoutSignature = signature;
        } catch (error) {
          showStatus(error.message || 'Saved Overlay Bay scene is unavailable.', true, 0);
        }
      }

      async function refreshXboxStatus() {
        if (!authenticated || !savedXboxWidget()) {
          xboxStatusKnown = true;
          xboxSessionRunning = false;
          applyXboxRuntimeVisibility();
          clearXboxFrame();
          return;
        }
        try {
          const data = await getJson('/api/cloud-xbox/status');
          const wasRunning = xboxSessionRunning;
          xboxStatusKnown = true;
          xboxSessionRunning = Boolean(data?.running);
          applyXboxRuntimeVisibility();
          if (wasRunning && !xboxSessionRunning) clearXboxFrame();
        } catch {
          // A status transport miss should not make a live game blink out. Keep the last known state.
        }
      }

      async function refreshXboxFrame() {
        if (frameBusy || !authenticated || !savedXboxWidget() || !xboxStatusKnown || !xboxSessionRunning) return;

        const image = (() => {
          try {
            return overlayRuntime.contentDocument?.querySelector('[data-broadcast-safe-xbox-frame]') || null;
          } catch {
            return null;
          }
        })();
        if (!image) {
          installXboxFrameIntoSavedWidget();
          return;
        }

        frameBusy = true;
        try {
          const response = await fetch(`/api/cloud-xbox/frame?t=${Date.now()}`, {
            credentials: 'include',
            cache: 'no-store',
            headers: authHeaders(),
          });
          if (!response.ok) return;
          const blob = await response.blob();
          if (!blob.type.startsWith('image/')) return;

          const url = URL.createObjectURL(blob);
          const probe = new Image();
          probe.onload = () => {
            image.src = url;
            const previous = lastObjectUrl;
            lastObjectUrl = url;
            if (previous) URL.revokeObjectURL(previous);
          };
          probe.onerror = () => URL.revokeObjectURL(url);
          probe.src = url;
        } catch {
          // While Xbox still reports running, keep the last valid frame through transient frame misses.
        } finally {
          frameBusy = false;
        }
      }

      function forwardAlert(payload) {
        try {
          overlayRuntime.contentWindow?.postMessage({ ...payload, type: 'spmt.overlay.alert' }, location.origin);
        } catch {}
      }

      window.spmtOverlayAlert = (payload = {}) => forwardAlert(payload);
      window.addEventListener('spmt:overlay-alert', (event) => forwardAlert(event.detail || {}));
      window.addEventListener('message', (event) => {
        if (event.source === window || event.origin === location.origin) {
          const data = event.data || {};
          if (data.type === 'spmt.overlay.alert' || data.type === 'spacemountain.alert') forwardAlert(data);
        }
      });

      overlayRuntime.addEventListener('load', () => {
        revealRuntimeWhenReady();
        setTimeout(revealRuntimeWhenReady, 150);
        setTimeout(revealRuntimeWhenReady, 700);
      });

      window.addEventListener('beforeunload', () => {
        if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
      });

      refreshLayout(true);
      refreshXboxStatus();
      setInterval(() => refreshLayout(false), 2000);
      setInterval(refreshXboxStatus, 1000);
      setInterval(refreshXboxFrame, 500);
      setInterval(installXboxFrameIntoSavedWidget, 1500);
      setInterval(installProgramTransparency, 1500);
    })();
  </script>
</body>
</html>
