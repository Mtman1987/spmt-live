<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpaceMountain Live Spotlight</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    #root{position:fixed;inset:0;background:transparent}
    #twitch-player{position:absolute;inset:0;width:100%;height:100%;background:transparent}
    #play-fallback{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.18);border:0;color:#fff;font:700 18px/1 system-ui,sans-serif;cursor:pointer;z-index:2}
    #play-fallback.show{display:grid}
    #status{position:absolute;left:14px;bottom:14px;z-index:3;display:none;max-width:min(560px,calc(100% - 28px));padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font:600 13px/1.3 system-ui,sans-serif}
    #status.show{display:block}
  </style>
</head>
<body>
  <div id="root" aria-live="off">
    <div id="twitch-player"></div>
    <button id="play-fallback" type="button" aria-label="Play live Twitch stream">Tap to play live stream</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    (() => {
      'use strict';
      const playerHost = document.getElementById('twitch-player');
      const playFallback = document.getElementById('play-fallback');
      const statusEl = document.getElementById('status');
      const params = new URLSearchParams(location.search);
      const forcedChannel = String(params.get('channel') || '').replace(/^@/, '').trim().toLowerCase();
      const testMode = params.get('test') === '1' || Boolean(forcedChannel);
      const interactionMode = params.get('interact') === '1' || testMode;
      const controlBus = typeof BroadcastChannel === 'function'
        ? new BroadcastChannel('spmt-live-spotlight-control-v1')
        : null;
      let applyingRemoteControl = false;
      let currentLogin = '';
      let stopped = false;
      let player = null;
      let fallbackTimer = null;

      function setStatus(message) {
        statusEl.textContent = String(message || '');
        statusEl.classList.toggle('show', Boolean(message));
      }

      function clearFallback() {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        playFallback.classList.remove('show');
      }

      function clear() {
        currentLogin = '';
        clearFallback();
        if (!interactionMode) setStatus('');
        try { player?.pause?.(); } catch {}
        player = null;
        playerHost.replaceChildren();
      }

      const TARGET_VOLUME = 0.58;

      function forcePlay() {
        if (!player) return;
        try { player.setVolume(TARGET_VOLUME); } catch {}
        try { player.setMuted(true); } catch {}
        try { player.play(); } catch {}
      }

      function restoreAudio() {
        if (!player) return;
        try { player.setVolume(TARGET_VOLUME); } catch {}
        try { player.setMuted(false); } catch {}
      }

      function mount(login) {
        const clean = String(login || '').trim().toLowerCase();
        if (!clean) {
          clear();
          if (testMode) setStatus('No featured live channel is available right now.');
          return;
        }
        if (clean === currentLogin && player) {
          forcePlay();
          return;
        }

        clear();
        currentLogin = clean;
        if (!window.Twitch?.Player) return;

        if (interactionMode) setStatus('Loading @' + clean + '…');

        player = new window.Twitch.Player('twitch-player', {
          channel: clean,
          parent: [location.hostname || 'spmt.live'],
          autoplay: true,
          muted: true,
          controls: interactionMode,
          width: '100%',
          height: '100%',
        });

        player.addEventListener(window.Twitch.Player.READY, () => {
          forcePlay();
          if (interactionMode) setStatus('Loaded @' + clean + '. Use this window to interact while the overlay stays on-screen.');
          clearFallback();
          fallbackTimer = setTimeout(() => {
            playFallback.classList.add('show');
          }, 1800);
        });
        player.addEventListener(window.Twitch.Player.PLAY, () => {
          clearFallback();
          restoreAudio();
          publishControl('play');
          if (interactionMode) setStatus('Playing @' + clean + ' — this play state is also sent to the overlay.');
        });
        player.addEventListener(window.Twitch.Player.PLAYING, () => {
          restoreAudio();
          setTimeout(restoreAudio, 250);
          setTimeout(restoreAudio, 1000);
        });
        player.addEventListener(window.Twitch.Player.PAUSE, () => {
          playFallback.classList.add('show');
          publishControl('pause');
          if (interactionMode) setStatus('Playback paused. Tap Play to resume.');
        });
        player.addEventListener(window.Twitch.Player.OFFLINE, () => {
          clear();
          if (interactionMode) setStatus('@' + clean + ' is offline.');
        });
      }

      function publishControl(action) {
        if (!interactionMode || applyingRemoteControl || !controlBus || !currentLogin) return;
        try {
          controlBus.postMessage({
            type: 'spmt.live-spotlight.control',
            action,
            channel: currentLogin,
          });
        } catch {}
      }

      function applyRemoteControl(payload) {
        if (!payload || payload.type !== 'spmt.live-spotlight.control') return;
        const channel = String(payload.channel || '').trim().toLowerCase();
        if (!channel || !currentLogin || channel !== currentLogin) return;
        applyingRemoteControl = true;
        try {
          if (payload.action === 'play') {
            forcePlay();
            setTimeout(restoreAudio, 150);
            playFallback.classList.remove('show');
          } else if (payload.action === 'pause') {
            try { player?.pause?.(); } catch {}
          }
        } finally {
          setTimeout(() => { applyingRemoteControl = false; }, 500);
        }
      }

      if (controlBus) controlBus.addEventListener('message', (event) => applyRemoteControl(event.data));

      playFallback.addEventListener('click', () => {
        forcePlay();
        setTimeout(restoreAudio, 150);
        playFallback.classList.remove('show');
        publishControl('play');
      });

      async function refresh() {
        if (stopped) return;
        if (forcedChannel) {
          mount(forcedChannel);
          return;
        }
        try {
          const response = await fetch('https://discord-stream-hub-new.fly.dev/api/community-spotlight', {
            cache: 'no-store',
            headers: { Accept: 'application/json' },
          });
          if (!response.ok) throw new Error('spotlight ' + response.status);
          const data = await response.json();
          const login = data?.spotlight?.twitchLogin || data?.spotlight?.user?.twitchLogin || '';
          mount(login);
        } catch {
          clear();
        }
      }

      addEventListener('beforeunload', () => {
        stopped = true;
        try { controlBus?.close?.(); } catch {}
      });
      void refresh();
      setInterval(refresh, 15000);
    })();
  </script>
</body>
</html>
