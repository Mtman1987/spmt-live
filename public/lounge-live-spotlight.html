<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpaceMountain Live Spotlight</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    #root{position:fixed;inset:0;background:transparent}
    #twitch-player{position:absolute;inset:0;width:100%;height:100%;background:transparent}
    #play-fallback{position:absolute;right:14px;top:14px;display:none;padding:10px 14px;border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(249,115,22,.95);color:#fff;font:700 14px/1 system-ui,sans-serif;cursor:pointer;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.45)}
    #play-fallback.show{display:block}
    #status{position:absolute;left:14px;bottom:14px;z-index:3;display:none;max-width:min(560px,calc(100% - 28px));padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font:600 13px/1.3 system-ui,sans-serif}
    #status.show{display:block}
  </style>
</head>
<body>
  <div id="root" aria-live="off">
    <div id="twitch-player"></div>
    <button id="play-fallback" type="button" aria-label="Enable sound for the live Twitch stream">Enable sound</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    (() => {
      'use strict';
      const playerHost = document.getElementById('twitch-player');
      const playFallback = document.getElementById('play-fallback');
      const statusEl = document.getElementById('status');
      const params = new URLSearchParams(location.search);
      const forcedChannel = String(params.get('channel') || '').replace(/^@/, '').trim().toLowerCase();
      const testMode = params.get('test') === '1' || Boolean(forcedChannel);
      let currentLogin = '';
      let stopped = false;
      let player = null;
      let fallbackTimer = null;
      let userUnlocked = false;
      let switchingChannel = false;
      let isPlaying = false;
      let brbMuted = false;
      let brbVodActive = false;
      let brbReturnToLive = false;
      let pendingLogin = '';
      let missingPolls = 0;
      let playbackDeadline = null;

      function reportHealth(healthy) {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'spmt-lounge-spotlight-health', healthy }, 'https://spmt.live');
        }
      }

      function checkPlaybackSoon(login) {
        if (playbackDeadline) clearTimeout(playbackDeadline);
        playbackDeadline = setTimeout(() => {
          if (!brbMuted && !brbVodActive && currentLogin === login && player) reportHealth(false);
        }, 12000);
      }

      function setStatus(message) {
        statusEl.textContent = String(message || '');
        statusEl.classList.toggle('show', Boolean(message));
      }

      function clearFallback() {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        playFallback.classList.remove('show');
      }

      function clear() {
        currentLogin = '';
        isPlaying = false;
        clearFallback();
        if (!testMode) setStatus('');
        try { player?.pause?.(); } catch {}
      }

      let groupLevel = 0.58;
      let masterLevel = 1;
      let sourceVolume = 1;
      let sourceMuted = false;
      function effectiveVolume() {
        return groupLevel * masterLevel * sourceVolume;
      }
      function restoreAudio() {
        if (!player) return;
        try { player.setVolume(effectiveVolume()); } catch {}
        try { player.setMuted(!userUnlocked || brbMuted || sourceMuted || effectiveVolume() === 0); } catch {}
      }
      function forcePlay(mutedBootstrap = false) {
        if (!player) return;
        try { player.setVolume(effectiveVolume()); } catch {}
        if (mutedBootstrap || brbMuted || sourceMuted || effectiveVolume() === 0) {
          try { player.setMuted(true); } catch {}
        }
        try { player.play(); } catch {}
      }
      async function refreshBroadcastMix() {
        try {
          const response = await fetch('https://streamweaver-new.fly.dev/api/lounge/audio-mix', { cache: 'no-store' });
          if (!response.ok) return;
          const levels = (await response.json())?.levels;
          const spotlight = Number(levels?.spotlight);
          const all = levels?.all === undefined ? 100 : Number(levels.all);
          if (!Number.isInteger(spotlight) || spotlight < 0 || spotlight > 100
            || !Number.isInteger(all) || all < 0 || all > 100) return;
          groupLevel = spotlight / 100;
          masterLevel = all / 100;
          restoreAudio();
        } catch {}
      }

      function unlockAudioFromGesture() {
        userUnlocked = true;
        switchingChannel = false;
        forcePlay(false);
        restoreAudio();
        [150, 500, 1000].forEach((delay) => setTimeout(restoreAudio, delay));
        clearFallback();
      }

      function mount(login) {
        const clean = String(login || '').trim().toLowerCase();
        if (!clean) {
          clear();
          if (testMode) setStatus('No featured live channel is available right now.');
          if (++missingPolls >= 2) reportHealth(false);
          return;
        }
        // The 15-second spotlight poll must not restart or re-mute the same
        // player. That would discard the viewer's one Twitch interaction.
        if (clean === currentLogin && player) return;

        // Keep one Twitch.Player instance for the life of the page. Replacing
        // the iframe loses the browser's prior user activation and forces a
        // fresh click every time the community spotlight rotates.
        if (player) {
          currentLogin = clean;
          switchingChannel = true;
          checkPlaybackSoon(clean);
          clearFallback();
          if (testMode) setStatus('Switching to @' + clean + '…');
          try { player.setChannel(clean); } catch {}
          forcePlay(!userUnlocked);
          [350, 1200, 2500, 4000].forEach((delay) =>
            setTimeout(() => forcePlay(!userUnlocked), delay),
          );
          if (userUnlocked) restoreAudio();
          return;
        }

        clear();
        currentLogin = clean;
        checkPlaybackSoon(clean);
        if (!window.Twitch?.Player) return;

        if (testMode) setStatus('Loading @' + clean + '…');

        player = new window.Twitch.Player('twitch-player', {
          channel: clean,
          parent: [location.hostname || 'spmt.live'],
          autoplay: true,
          muted: true,
          controls: true,
          width: '100%',
          height: '100%',
        });

        player.addEventListener(window.Twitch.Player.READY, () => {
          forcePlay(true);
          if (testMode) setStatus('Loaded @' + clean + '. If autoplay is blocked, use the Play button.');
          clearFallback();
          fallbackTimer = setTimeout(() => {
            playFallback.classList.add('show');
          }, 1800);
        });
        player.addEventListener(window.Twitch.Player.PLAY, () => {
          switchingChannel = false;
          if (userUnlocked) {
            clearFallback();
            restoreAudio();
          } else {
            playFallback.classList.add('show');
          }
          if (testMode) setStatus('Playing @' + clean + ' — use the Twitch volume controls in the player.');
        });
        player.addEventListener(window.Twitch.Player.PLAYING, () => {
          switchingChannel = false;
          isPlaying = true;
          if (playbackDeadline) clearTimeout(playbackDeadline);
          missingPolls = 0;
          if (!brbVodActive) reportHealth(true);
          if (userUnlocked) {
            clearFallback();
            restoreAudio();
            setTimeout(restoreAudio, 250);
            setTimeout(restoreAudio, 1000);
          } else {
            playFallback.classList.add('show');
          }
        });
        player.addEventListener(window.Twitch.Player.PAUSE, () => {
          if (switchingChannel) {
            setTimeout(() => forcePlay(!userUnlocked), 300);
            return;
          }
          isPlaying = false;
          if (brbMuted || brbVodActive) return;
          playFallback.classList.add('show');
          checkPlaybackSoon(currentLogin);
          if (testMode) setStatus('Playback paused. Tap Play to resume.');
        });
        player.addEventListener(window.Twitch.Player.OFFLINE, () => {
          if (brbVodActive) return;
          reportHealth(false);
          currentLogin = '';
          clearFallback();
          if (testMode) setStatus('@' + clean + ' is offline. Use ?channel=ANOTHER_LIVE_CHANNEL&test=1 to test playback.');
        });
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://spmt.live' || event.source !== window.parent
          || event.data?.type !== 'spmt.obspmt.audio') return;
        const volume = Number(event.data.volume);
        if (!Number.isFinite(volume) || volume < 0 || volume > 1 || typeof event.data.muted !== 'boolean') return;
        sourceVolume = volume;
        sourceMuted = event.data.muted;
        restoreAudio();
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://spmt.live' || event.source !== window.parent
          || event.data?.type !== 'spmt-lounge-brb-audio') return;
        const nextVod = event.data.active === true && event.data.mode === 'vod'
          && /^\d+$/.test(String(event.data.videoId || ''))
          && Number.isFinite(Number(event.data.vodOffset)) && Number(event.data.vodOffset) >= 0;
        brbVodActive = nextVod;
        if (nextVod) brbReturnToLive = true;
        brbMuted = event.data.active === true && !nextVod;
        if (nextVod) {
          if (playbackDeadline) clearTimeout(playbackDeadline);
          clearFallback();
          try { player?.setVideo?.('v' + event.data.videoId, Number(event.data.vodOffset)); } catch {}
          restoreAudio();
        } else if (brbMuted) {
          if (playbackDeadline) clearTimeout(playbackDeadline);
          clearFallback();
          isPlaying = false;
          try { player?.pause?.(); } catch {}
        } else if (brbReturnToLive && event.data.active !== true) {
          brbReturnToLive = false;
          const login = pendingLogin || currentLogin;
          pendingLogin = '';
          currentLogin = '';
          mount(login);
        } else {
          forcePlay(!userUnlocked);
          checkPlaybackSoon(currentLogin);
          restoreAudio();
        }
      });

      playFallback.addEventListener('click', () => {
        unlockAudioFromGesture();
      });

      async function refresh() {
        if (stopped) return;
        if (forcedChannel) {
          mount(forcedChannel);
          return;
        }
        try {
          const response = await fetch('https://discord-stream-hub-new.fly.dev/api/community-spotlight', {
            cache: 'no-store',
            headers: { Accept: 'application/json' },
          });
          if (!response.ok) throw new Error('spotlight ' + response.status);
          const data = await response.json();
          const login = data?.spotlight?.twitchLogin || data?.spotlight?.user?.twitchLogin || '';
          if (brbVodActive) pendingLogin = login;
          else mount(login);
        } catch {
          if (++missingPolls >= 2 && !isPlaying && !brbVodActive && !brbMuted) reportHealth(false);
        }
      }

      addEventListener('beforeunload', () => { stopped = true; });
      void refresh();
      void refreshBroadcastMix();
      setInterval(refresh, 15000);
      setInterval(refreshBroadcastMix, 3000);
    })();
  </script>
</body>
</html>
