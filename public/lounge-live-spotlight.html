<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpaceMountain Live Spotlight</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    #root{position:fixed;inset:0;background:transparent}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
  </style>
</head>
<body>
  <div id="root" aria-live="off"></div>
  <script>
    (() => {
      'use strict';
      const root = document.getElementById('root');
      let currentLogin = '';
      let stopped = false;

      function clear() {
        currentLogin = '';
        root.replaceChildren();
      }

      function mount(login) {
        const clean = String(login || '').trim().toLowerCase();
        if (!clean) return clear();
        if (clean === currentLogin && root.firstChild) return;
        currentLogin = clean;
        const frame = document.createElement('iframe');
        const parent = location.hostname || 'spmt.live';
        frame.src = 'https://player.twitch.tv/?channel=' + encodeURIComponent(clean)
          + '&parent=' + encodeURIComponent(parent)
          + '&autoplay=true&muted=true&controls=false';
        frame.title = clean + ' live on Twitch';
        frame.allow = 'autoplay; fullscreen';
        frame.allowFullscreen = true;
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        root.replaceChildren(frame);
      }

      async function refresh() {
        if (stopped) return;
        try {
          const response = await fetch('https://discord-stream-hub-new.fly.dev/api/community-spotlight', {
            cache: 'no-store',
            headers: { Accept: 'application/json' },
          });
          if (!response.ok) throw new Error('spotlight ' + response.status);
          const data = await response.json();
          const login = data?.spotlight?.twitchLogin || data?.spotlight?.user?.twitchLogin || '';
          mount(login);
        } catch {
          clear();
        }
      }

      addEventListener('beforeunload', () => { stopped = true; });
      void refresh();
      setInterval(refresh, 15000);
    })();
  </script>
</body>
</html>
