<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPMT Shared Surface</title>
  <link rel="stylesheet" href="/shared/shared.css">
  <link rel="stylesheet" href="/shared/worktray-control.css">
  <link rel="stylesheet" href="/shared/overlay-bay-v2.css">
  <link rel="stylesheet" href="/shared/overlay-platform-v3.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></symbol>
  </svg>
  <main class="surface-shell">
    <header class="surface-header">
      <div class="brand-mark">S</div>
      <div class="heading">
        <span class="eyebrow">SPMT shared surface</span>
        <h1 id="surface-title">Loading…</h1>
        <p id="surface-description">Loading your account-scoped workspace.</p>
      </div>
      <div class="header-actions">
        <span id="mode-chip" class="chip">panel</span>
        <button id="refresh-button" class="button ghost" type="button">Refresh</button>
        <button id="save-button" class="button primary hidden" type="button">Save changes</button>
      </div>
    </header>
    <div id="status" class="status">Connecting to your SPMT session…</div>
    <section id="surface-content" class="surface-content" aria-live="polite"></section>
  </main>
  <script src="/shared/overlay-widget-contract.js" defer></script>
  <script src="/shared/profile-constraints.js" defer></script>
  <script src="/shared/session-cache.js" defer></script>
  <script src="/shared/shared.js" defer></script>
  <script src="/shared/overlay-bay-v2.js" defer></script>
  <script src="/shared/cloud-xbox-source.js" defer></script>
  <script src="/shared/cloud-xbox-recovery.js" defer></script>
  <script src="/shared/worktray-control.js" defer></script>
  <script src="/shared/overlay-platform-v3.js" defer></script>
  <script src="/shared/overlay-platform-v3-binding-fix.js" defer></script>
  <script src="/shared/overlay-app-catalog.js" defer></script>
  <script src="/shared/overlay-text-controls.js" defer></script>
  <script src="/shared/overlay-bay-import-source.js" defer></script>
</body>
</html>
