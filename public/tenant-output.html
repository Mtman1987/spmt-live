<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SpaceMountain Tenant Output</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #stage-wrap{position:fixed;inset:0;overflow:hidden;background:transparent;pointer-events:none}
    #scene{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;background:transparent;transform-origin:0 0;pointer-events:none}
    .tenant-widget{position:absolute;overflow:hidden;background:transparent;pointer-events:none}
    .tenant-widget.lounge-program-swap{transition:left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1),width .8s cubic-bezier(.2,.8,.2,1),height .8s cubic-bezier(.2,.8,.2,1)}
    .tenant-widget.activity-idle-off{visibility:hidden}
    .tenant-widget.is-interactive,.tenant-widget.is-interactive iframe{pointer-events:auto}
    .tenant-widget iframe,.tenant-widget img,.tenant-widget video{display:block;width:100%;height:100%;border:0;background:transparent}
    .tenant-broadcast-frame{position:absolute;inset:0;pointer-events:none}
    .tenant-broadcast-frame i{position:absolute;border:2px solid #21e6ff;border-radius:9px;box-shadow:0 0 5px rgba(255,255,255,.9),0 0 13px #21e6ff,0 0 28px rgba(117,87,255,.92),inset 0 0 12px rgba(33,230,255,.28)}
    .tenant-widget.slot-alerts .tenant-alert-stage{padding:2px}
    .tenant-widget.slot-alerts .tenant-alert-card{min-height:37px;padding:4px 8px;border-radius:8px;gap:6px;grid-template-columns:auto 1fr}
    .tenant-widget.slot-alerts .tenant-alert-card img{width:28px;height:28px}
    .tenant-widget.slot-alerts .tenant-alert-kicker{display:none}
    .tenant-widget.slot-alerts .tenant-alert-card strong{margin:0;font-size:12px}
    .tenant-widget.slot-alerts .tenant-alert-card p{margin:2px 0 0;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tenant-text{width:100%;height:100%;display:grid;align-items:center;padding:12px;color:#fff;font-weight:900;line-height:1.05;text-shadow:0 3px 18px rgba(0,0,0,.8);white-space:pre-wrap;overflow:hidden}
    .tenant-alert-stage{position:absolute;inset:0;display:grid;place-items:center;padding:14px;pointer-events:none}
    .tenant-alert-card{--alert-accent:#f97316;width:min(100%,500px);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;padding:15px 18px;border:1px solid color-mix(in srgb,var(--alert-accent) 58%,white 8%);border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--alert-accent) 24%,#05070e),#05070e);box-shadow:0 18px 50px rgba(0,0,0,.46),0 0 28px color-mix(in srgb,var(--alert-accent) 22%,transparent);opacity:0;transform:translateY(22px) scale(.96);transition:opacity .22s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
    .tenant-alert-stage.is-showing .tenant-alert-card{opacity:1;transform:translateY(0) scale(1)}
    .tenant-alert-card img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--alert-accent) 45%,transparent))}
    .tenant-alert-card img[hidden]{display:none}
    .tenant-alert-kicker{display:block;color:var(--alert-accent);font-size:9px;font-weight:900;letter-spacing:.14em}
    .tenant-alert-card strong{display:block;margin-top:3px;color:#fff;font-size:20px;line-height:1.05}
    .tenant-alert-card p{margin:6px 0 0;color:#c6cede;font-size:11px;line-height:1.35}
    .tenant-test-marker{position:absolute;inset:0;border:3px dashed #22d3ee;background:rgba(34,211,238,.09);display:flex;align-items:flex-start;justify-content:flex-start;padding:6px;z-index:2147483647;pointer-events:none}
    .tenant-test-marker span{display:inline-block;max-width:100%;padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.82);color:#fff;font-size:11px;font-weight:900;line-height:1.15;white-space:normal}
    #lounge-audio-unlock{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid rgba(255,255,255,.34);border-radius:999px;background:rgba(5,8,18,.92);box-shadow:0 12px 36px rgba(0,0,0,.55),0 0 22px rgba(33,230,255,.24);color:#fff;font:800 14px/1 system-ui,sans-serif;cursor:pointer;pointer-events:auto}
    #lounge-audio-unlock[hidden]{display:none}
    #lounge-audio-note{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:2147483647;max-width:min(620px,88vw);padding:8px 12px;border-radius:10px;background:rgba(5,8,18,.9);color:#e9f7ff;font:700 12px/1.35 system-ui,sans-serif;text-align:center;pointer-events:none}
    #lounge-audio-note[hidden]{display:none}
  </style>
  <script src="/shared/emoji-fonts.js?v=1" defer></script>
</head>
<body>
  <div id="stage-wrap"><div id="scene"></div></div>
  <button id="lounge-audio-unlock" type="button" hidden aria-label="Enable Lounge audio">🔊 Enable Audio</button>
  <div id="lounge-audio-note" role="status" hidden></div>
  <script src="/shared/overlay-widget-contract.js"></script>
  <script>
    (() => {
      'use strict';

      const contract = window.SPMTOverlayWidgets;
      const sceneEl = document.getElementById('scene');
      const wrapEl = document.getElementById('stage-wrap');
      const pathParts = location.pathname.split('/').filter(Boolean);
      const tenant = decodeURIComponent(pathParts[1] || '').toLowerCase();
      const output = ['public', 'personal', 'lounge'].includes(pathParts[2]) ? pathParts[2] : 'public';
      const query = new URLSearchParams(location.search);
      // The cloud Studio controller can omit its duplicate local preview.
      // Restream's saved Browser Source URL continues to use the full renderer.
      if (output === 'lounge' && window.top !== window && query.get('localControllerPreview') === 'off') {
        document.documentElement.dataset.localControllerPreview = 'off';
        const notice = document.createElement('div');
        notice.textContent = 'Lounge preview paused here. Watch the live channel to check the broadcast.';
        notice.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:28px;background:#08101c;color:#b8d7e8;font:600 20px/1.5 system-ui;text-align:center';
        document.body.replaceChildren(notice);
        const restoreMs = Number(query.get('previewRestoreMs'));
        if (restoreMs >= 1000 && restoreMs <= 120000) {
          setTimeout(() => {
            const restored = new URL(location.href);
            restored.searchParams.delete('localControllerPreview');
            restored.searchParams.delete('previewRestoreMs');
            location.replace(restored.href);
          }, restoreMs);
        }
        return;
      }
      const testMode = output === 'lounge' && query.get('test') === '1';
      const loungeAudioUnlock = document.getElementById('lounge-audio-unlock');
      const loungeAudioNote = document.getElementById('lounge-audio-note');
      const loungeAudioUnlockEligible = output === 'lounge' && tenant === 'mtman1987'
        && window.matchMedia('(pointer: coarse)').matches;
      // Let the live lounge's persistent Spotlight player receive a real click.
      const spotlightInteractMode = output === 'lounge' && tenant === 'mtman1987';
      const state = {
        layout: contract.emptyLayout(),
        signature: '',
        xboxRelayToken: '',
        xboxStatusKnown: false,
        xboxRunning: false,
        frameBusy: false,
        lastFrameUrl: '',
        alertTimers: new Map(),
        testStarted: false,
        activityRotationStartedAt: Date.now(),
        loungeMediaMode: 'stream',
        commercialBreakActive: false,
        brbMode: 'off',
        masterVolume: 1,
        nebulaActivityActive: false,
      };

      const ALERT_TEMPLATES = {
        follow: { headline: '{user} joined the climb!', body: 'Welcome to SpaceMountain.' },
        sub: { headline: '{user} subscribed!', body: 'Thanks for fueling the mission.' },
        resub: { headline: '{user} resubscribed!', body: '{months} months on the mountain.' },
        gift: { headline: '{user} gifted {count} subs!', body: 'The crew just got bigger.' },
        raid: { headline: '{user} raided with {count}!', body: 'Raid party incoming.' },
        cheer: { headline: '{user} cheered {amount}!', body: 'Energy received.' },
        custom: { headline: '{headline}', body: '{message}' },
      };

      // Every output can display alerts immediately, even when Personal was
      // intentionally created with no widgets during the tenant transition.
      // A saved Alert widget takes precedence; this fallback never changes the
      // scene record and remains invisible until an alert event arrives.
      const DEFAULT_ALERT_WIDGET = {
        id: '__spmt-default-alert',
        title: 'SpaceMountain Default Alert',
        kind: 'alert',
        visible: true,
        locked: true,
        x: 0,
        y: 0,
        width: contract.scene.width,
        height: contract.scene.height,
        opacity: 1,
        zIndex: 100000,
        accent: '#f97316',
        durationMs: 6500,
        imageUrl: '',
        accepts: Object.keys(ALERT_TEMPLATES),
        templates: ALERT_TEMPLATES,
      };

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
        }[char]));
      }

      function applyTokens(template, payload) {
        return String(template || '').replace(/\{([a-z0-9_]+)\}/gi, (_, key) => {
          const value = payload[key];
          return value === undefined || value === null || value === '' ? '' : String(value);
        });
      }

      function normalizeAlert(payload = {}) {
        return {
          eventType: String(payload.eventType || payload.kind || payload.alertType || 'custom').toLowerCase(),
          user: payload.user || payload.username || payload.displayName || 'Someone',
          count: payload.count ?? payload.viewers ?? payload.gifts ?? 1,
          amount: payload.amount ?? payload.bits ?? '',
          months: payload.months ?? '',
          headline: payload.headline || 'SpaceMountain Alert',
          message: payload.message || '',
          imageUrl: payload.imageUrl || '',
        };
      }

      function resizeScene() {
        const width = wrapEl.clientWidth || innerWidth || contract.scene.width;
        const height = wrapEl.clientHeight || innerHeight || contract.scene.height;
        const scale = Math.min(width / contract.scene.width, height / contract.scene.height);
        const renderedWidth = contract.scene.width * scale;
        const renderedHeight = contract.scene.height * scale;
        sceneEl.style.left = `${(width - renderedWidth) / 2}px`;
        sceneEl.style.top = `${(height - renderedHeight) / 2}px`;
        sceneEl.style.transform = `scale(${scale})`;
      }

      function widgetStyle(widget) {
        const z = Number.isFinite(Number(widget.zIndex)) ? Number(widget.zIndex) : 0;
        return `left:${widget.x}%;top:${widget.y}%;width:${widget.width}px;height:${widget.height}px;opacity:${widget.opacity};z-index:${z}`;
      }

      function sourceMarkup(widget) {
        if (widget.kind === 'xbox') {
          return `<img data-tenant-xbox-frame alt="Xbox program video" style="object-fit:${escapeHtml(widget.fit || 'contain')}">`;
        }
        if (widget.kind === 'image') {
          return widget.url ? `<img src="${escapeHtml(widget.url)}" alt="${escapeHtml(widget.title)}" style="object-fit:${escapeHtml(widget.fit || 'contain')}">` : '';
        }
        if (widget.kind === 'video') {
          return widget.url ? `<video src="${escapeHtml(widget.url)}" autoplay muted loop playsinline style="object-fit:${escapeHtml(widget.fit || 'cover')}"></video>` : '';
        }
        if (widget.kind === 'frame') {
          const slots = [
            ['main', 2.5, 4.5, 69.5, 67], ['alerts', 75.5, 4.5, 22, 7.5],
            ['media', 75.5, 14.5, 22, 24], ['activity', 75.5, 41, 22, 51.9],
            ['stats', 2.5, 76, 21, 17], ['shoutouts', 26.75, 76, 21, 17], ['games', 51, 76, 21, 17],
          ];
          return `<div class="tenant-broadcast-frame">${slots.map(([id, x, y, width, height]) => `<i data-slot="${id}" style="left:${x}%;top:${y}%;width:${width}%;height:${height}%"></i>`).join('')}</div>`;
        }
        if (widget.kind === 'embed') {
          // Keep the viewer on spmt.live; read the Spotlight feed directly from
          // its own worker Machine, independent of the HearMeOut DJ.
          const embedUrl = output === 'lounge' && widget.id === 'community-lounge-live-spotlight'
            ? 'https://hearmeout-main.fly.dev/spotlight-media/worker-spotlight.html?v=visible-gif-5'
            : output === 'lounge' && widget.id === 'community-lounge-commercial'
              ? 'https://streamweaver-new.fly.dev/commercial-break-player?tenant=spacemountainlive&placement=lounge&v=visible-gif-5'
                        : output === 'lounge' && widget.id === 'community-lounge-hmo-media'
              ? 'https://hearmeout-main.fly.dev/lounge-media/player?v=live-lounge-1'
              : widget.url;
          return embedUrl ? `<iframe src="${escapeHtml(embedUrl)}" title="${escapeHtml(widget.title)}" allow="autoplay; microphone; camera; fullscreen; clipboard-write; display-capture"></iframe>` : '';
        }
        if (widget.kind === 'text') {
          const size = Math.max(12, Number(widget.fontSize) || 42);
          const align = ['left', 'right', 'center'].includes(widget.align) ? widget.align : 'center';
          const color = widget.color || '#ffffff';
          return `<div class="tenant-text" style="font-size:${size}px;text-align:${align};justify-items:${align === 'left' ? 'start' : align === 'right' ? 'end' : 'center'};color:${escapeHtml(color)}">${escapeHtml(widget.text || 'Text')}</div>`;
        }
        if (widget.kind === 'alert') {
          return `<div class="tenant-alert-stage" data-tenant-alert="${escapeHtml(widget.id)}"><div class="tenant-alert-card"><img data-alert-image alt="" hidden><div><span class="tenant-alert-kicker">SPACEMOUNTAIN ALERT</span><strong data-alert-headline></strong><p data-alert-body></p></div></div></div>`;
        }
        // Camera and screen are permission-bound local sources. Detached tenant outputs stay transparent until a persistent adapter supplies media.
        return '';
      }

      // Keep the clicked Twitch player mounted; BRB can switch it to a source VOD.
      let brbMode = 'off';
      let brbVod = null;
      function relayBRBAudio(mode, vod = null) {
        brbVod = mode === 'vod' ? vod : null;
        brbMode = mode;
        state.brbMode = mode;
        applyLoungeMediaLayout();
        for (const id of ['community-lounge-live-spotlight', 'community-lounge-hmo-media', 'sw-shoutout']) {
          const frame = sceneEl.querySelector(`[data-tenant-widget="${id}"] iframe`);
          const active = mode !== 'off';
          if (frame) frame.contentWindow?.postMessage(
            { type: 'spmt-lounge-brb-audio', active, mode, ...(id === 'community-lounge-live-spotlight' && brbVod ? brbVod : {}) },
            new URL(frame.src).origin);
        }
      }
      window.addEventListener('message', (event) => {
        if (output !== 'lounge' || tenant !== 'mtman1987' || event.origin !== 'https://streamweaver-new.fly.dev') return;
        const brb = sceneEl.querySelector('[data-tenant-widget="community-lounge-brb"] iframe');
        if (event.source !== brb?.contentWindow || event.data?.type !== 'spmt-lounge-brb-audio' || typeof event.data.active !== 'boolean') return;
        const vod = /^\d+$/.test(String(event.data.videoId || '')) && Number.isFinite(Number(event.data.vodOffset)) && Number(event.data.vodOffset) >= 0
          ? { videoId: String(event.data.videoId), vodOffset: Number(event.data.vodOffset) } : null;
        const mode = event.data.active ? (event.data.mode === 'vod' && vod ? 'vod' : event.data.mode === 'stream' ? 'stream' : event.data.mode === 'gif' ? 'gif' : 'clip') : 'off';
        relayBRBAudio(mode, vod);
      });
      window.addEventListener('message', (event) => {
        if (output !== 'lounge' || tenant !== 'mtman1987' || event.origin !== 'https://streamweaver-new.fly.dev') return;
        const brb = sceneEl.querySelector('[data-tenant-widget="community-lounge-brb"] iframe');
        const spotlight = sceneEl.querySelector('[data-tenant-widget="community-lounge-live-spotlight"] iframe');
        if (event.source !== brb?.contentWindow || event.data?.type !== 'spmt-lounge-testbrb' || brbMode !== 'stream') return;
        const channel = String(event.data.channel || '').toLowerCase();
        if (!/^[a-z0-9_]{3,25}$/.test(channel)) return;
        if (spotlight) spotlight.contentWindow?.postMessage({ type: 'spmt-lounge-testbrb', channel }, new URL(spotlight.src).origin);
      });
      sceneEl.addEventListener('load', (event) => {
        if (brbMode === 'off' || !(event.target instanceof HTMLIFrameElement)) return;
        const id = event.target.parentElement?.dataset.tenantWidget;
        if (!['community-lounge-live-spotlight', 'community-lounge-hmo-media', 'sw-shoutout'].includes(id)) return;
        const active = brbMode !== 'off';
        event.target.contentWindow?.postMessage({ type: 'spmt-lounge-brb-audio', active, mode: brbMode, ...(id === 'community-lounge-live-spotlight' && brbVod ? brbVod : {}) }, new URL(event.target.src).origin);
      }, true);

      function applyNativeMaster() {
        for (const widget of state.layout.widgets || []) {
          const element = sceneEl.querySelector(`[data-tenant-widget="${CSS.escape(widget.id)}"]`);
          const media = element?.querySelector('video,audio');
          if (!media) continue;
          const source = widget.controlAudioViaOBSpmt === true
            ? Math.max(0, Math.min(100, Number(widget.audioVolume) || 0)) / 100 : 1;
          media.volume = source * state.masterVolume;
          media.muted = state.masterVolume === 0
            || (widget.controlAudioViaOBSpmt === true ? widget.audioMuted === true : widget.muted !== false);
        }
      }

      async function refreshMasterVolume() {
        if (output !== 'lounge') return;
        try {
          const response = await fetch('https://streamweaver-new.fly.dev/api/lounge/audio-mix', { cache: 'no-store' });
          if (!response.ok) return;
          const level = Number((await response.json())?.levels?.all);
          if (!Number.isInteger(level) || level < 0 || level > 100) return;
          if (state.masterVolume === level / 100) return;
          state.masterVolume = level / 100;
          applyNativeMaster();
        } catch {}
      }

      const controlledSources = new Set();
      function pulseLocalLoungeAudioUnlock() {
        if (!loungeAudioUnlockEligible) return;
        const at = Date.now();
        for (const widget of state.layout.widgets || []) {
          if (widget.controlAudioViaOBSpmt !== true) continue;
          const element = sceneEl.querySelector(`[data-tenant-widget="${CSS.escape(widget.id)}"]`);
          const media = element?.querySelector('video,audio');
          if (media && !media.ended) {
            media.play?.().catch?.(() => {});
          }
          const frame = element?.querySelector('iframe');
          if (!frame) continue;
          try {
            const target = new URL(frame.src);
            if (!['https:', 'http:'].includes(target.protocol)) continue;
            frame.contentWindow?.postMessage({ type: 'spmt-lounge-unmute-pulse', at, viewerGesture: true }, target.origin);
          } catch {}
        }
      }

      if (loungeAudioUnlockEligible && loungeAudioUnlock) {
        loungeAudioUnlock.hidden = false;
        loungeAudioUnlock.addEventListener('click', () => {
          pulseLocalLoungeAudioUnlock();
          loungeAudioUnlock.hidden = true;
          if (loungeAudioNote) {
            loungeAudioNote.textContent = 'Audio enabled. If playback is blocked, tap Enable Audio in the media viewer.';
            loungeAudioNote.hidden = false;
            window.setTimeout(() => { loungeAudioNote.hidden = true; }, 8000);
          }
        });
      }

      function applySourceAudio(widget) {
        const enabled = widget.controlAudioViaOBSpmt === true;
        if (!enabled && !controlledSources.has(widget.id)) return;
        const element = sceneEl.querySelector(`[data-tenant-widget="${CSS.escape(widget.id)}"]`);
        if (!element) return;
        if (enabled) controlledSources.add(widget.id);
        else controlledSources.delete(widget.id);
        const level = enabled ? Math.max(0, Math.min(100, Number(widget.audioVolume) || 0)) / 100 : 1;
        const muted = enabled ? widget.audioMuted === true : widget.muted === true;
        const media = element.querySelector('video,audio');
        if (media) {
          media.volume = level;
          media.muted = muted;
        }
        const frame = element.querySelector('iframe');
        if (!frame) return;
        try {
          const target = new URL(frame.src);
          if (!['https:', 'http:'].includes(target.protocol)) return;
          frame.contentWindow?.postMessage({ type: 'spmt.obspmt.audio', volume: level, muted }, target.origin);
        } catch {}
      }

      sceneEl.addEventListener('load', (event) => {
        if (!(event.target instanceof HTMLIFrameElement)) return;
        const id = event.target.closest('[data-tenant-widget]')?.dataset.tenantWidget;
        const widget = state.layout.widgets.find((item) => item.id === id);
        if (widget) applySourceAudio(widget);
      }, true);

      // A failed cross-origin frame stays on the browser's error page after
      // Streamweaver recovers. Only these two silent live-card frames may retry;
      // never reload the movie, Spotlight, TTS, or game players.
      const liveCardIds = ['community-lounge-live-partners', 'community-lounge-live-community'];
      let liveCardsHealthy = null;
      let liveCardProbeBusy = false;
      let lastLiveCardReloadAt = 0;
      function retryLiveCards() {
        if (output !== 'lounge' || tenant !== 'mtman1987' || liveCardProbeBusy) return;
        const frames = liveCardIds.map((id) => sceneEl.querySelector(`[data-tenant-widget="${id}"] iframe`)).filter(Boolean);
        if (!frames.length) return;
        liveCardProbeBusy = true;
        const probe = new Image();
        const timeout = setTimeout(() => { liveCardProbeBusy = false; liveCardsHealthy = false; }, 8000);
        probe.onload = () => {
          clearTimeout(timeout);
          liveCardProbeBusy = false;
          const recovered = liveCardsHealthy === false;
          const firstCheck = liveCardsHealthy === null;
          liveCardsHealthy = true;
          const now = Date.now();
          if (!recovered && !firstCheck && now - lastLiveCardReloadAt < 120000) return;
          frames.forEach((frame) => { frame.src = frame.src; });
          lastLiveCardReloadAt = now;
        };
        probe.onerror = () => {
          clearTimeout(timeout);
          liveCardProbeBusy = false;
          liveCardsHealthy = false;
        };
        probe.src = `https://streamweaver-new.fly.dev/favicon.ico?lounge-probe=${Date.now()}`;
      }

      // Retry a player frame only until its page confirms it booted. A failed
      // navigation can remain on Chrome's error page after HearMeOut recovers.
      // Never remount a player that has booted, even if its feed is waiting.
      const playerFrames = [
        { id: 'community-lounge-hmo-media', readyType: 'spmt-lounge-media-ready', frame: null, ready: false, mountedAt: 0, lastRetryAt: 0, probeBusy: false },
        { id: 'community-lounge-live-spotlight', readyType: 'spmt-lounge-spotlight-ready', frame: null, ready: false, mountedAt: 0, lastRetryAt: 0, lastReadyAt: 0, probeBusy: false },
      ];
      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://hearmeout-main.fly.dev') return;
        const player = playerFrames.find((entry) => entry.readyType === event.data?.type);
        if (!player) return;
        const frame = sceneEl.querySelector(`[data-tenant-widget="${player.id}"] iframe`);
        if (frame && event.source === frame.contentWindow) {
          player.frame = frame;
          player.ready = true;
          player.lastReadyAt = Date.now();
        }
      });
      async function retryUnloadedPlayerFrames() {
        if (output !== 'lounge' || tenant !== 'mtman1987') return;
        for (const player of playerFrames) {
          const frame = sceneEl.querySelector(`[data-tenant-widget="${player.id}"] iframe`);
          if (frame !== player.frame) {
            player.frame = frame;
            player.ready = false;
            player.lastReadyAt = 0;
            player.mountedAt = Date.now();
            player.lastRetryAt = 0;
          }
          const spotlightHeartbeatStale = player.id === 'community-lounge-live-spotlight' && player.ready && player.lastReadyAt > 0 && Date.now() - player.lastReadyAt > 20000;
          if (spotlightHeartbeatStale) player.ready = false;
          if (!frame || player.ready || player.probeBusy ||
              Date.now() - player.mountedAt < 20000 ||
              Date.now() - player.lastRetryAt < 30000) continue;
          player.probeBusy = true;
          const abort = new AbortController();
          // The remote Restream browser has taken over 10 seconds to fetch this
          // page, so an 8-second health probe could never trigger recovery.
          const timeout = setTimeout(() => abort.abort(), 30000);
          try {
            await fetch(frame.src, { mode: 'no-cors', cache: 'no-store', signal: abort.signal });
            if (frame === player.frame && !player.ready) {
              player.lastRetryAt = Date.now();
              const url = new URL(frame.src);
              url.searchParams.set('recover', String(player.lastRetryAt));
              frame.src = url.href;
            }
          } catch {
            player.lastRetryAt = Date.now();
          } finally {
            clearTimeout(timeout);
            player.probeBusy = false;
          }
        }
      }

      function renderScene() {
        const layout = state.layout;
        if (layout.enabled === false) {
          sceneEl.replaceChildren();
          clearXboxFrame();
          return;
        }
        const allWidgets = layout.widgets || [];
        const visibleWidgets = allWidgets.filter((widget) => widget.visible !== false);
        const hasSavedAlert = allWidgets.some((widget) => widget.kind === 'alert');
        const savedMarkup = visibleWidgets.map((widget) =>
          `<section class="tenant-widget kind-${escapeHtml(widget.kind)}${widget.layoutSlot ? ` slot-${escapeHtml(widget.layoutSlot)}` : ''}${widget.interactive === true || widget.interactionMode === 'interactive' || (spotlightInteractMode && widget.id === 'community-lounge-live-spotlight') || (loungeAudioUnlockEligible && widget.id === 'community-lounge-hmo-media') ? ' is-interactive' : ''}" data-tenant-widget="${escapeHtml(widget.id)}" style="${widgetStyle(widget)}">${sourceMarkup(widget)}</section>`
        ).join('');
        const fallbackAlertMarkup = hasSavedAlert ? '' :
          `<section class="tenant-widget kind-alert default-alert" data-tenant-widget="${DEFAULT_ALERT_WIDGET.id}" style="${widgetStyle(DEFAULT_ALERT_WIDGET)}">${sourceMarkup(DEFAULT_ALERT_WIDGET)}</section>`;
        // Keep running embeds mounted when another Lounge widget or its layout changes.
        // Recreating an iframe restarts its player and interrupts the 24/7 program.
        const nextScene = document.createElement('template');
        nextScene.innerHTML = savedMarkup + fallbackAlertMarkup;
        const existing = new Map([...sceneEl.children].map((element) => [element.dataset.tenantWidget, element]));
        const nextIds = new Set();
        [...nextScene.content.children].forEach((replacement) => {
          const id = replacement.dataset.tenantWidget;
          nextIds.add(id);
          const current = existing.get(id);
          const oldMedia = current?.querySelector('iframe, video');
          const newMedia = replacement.querySelector('iframe, video');
          if (oldMedia && newMedia && oldMedia.tagName === newMedia.tagName &&
              oldMedia.getAttribute('src') === newMedia.getAttribute('src')) {
            current.className = replacement.className;
            current.style.cssText = replacement.style.cssText;
            oldMedia.style.cssText = newMedia.style.cssText;
            if (newMedia.tagName === 'IFRAME') {
              oldMedia.title = newMedia.title;
              oldMedia.setAttribute('allow', newMedia.getAttribute('allow') || '');
            }
            return; // Do not detach or reparent a live iframe: either can reload it.
          }
          if (current) current.replaceWith(replacement);
          else sceneEl.append(replacement);
        });
        [...sceneEl.children].forEach((element) => {
          if (!nextIds.has(element.dataset.tenantWidget)) element.remove();
        });
        visibleWidgets.forEach(applySourceAudio);
        applyNativeMaster();
        applyLoungeMediaLayout();
        applyActivityRotation();
        applyXboxVisibility();
        if (testMode && !state.testStarted) {
          state.testStarted = true;
          setTimeout(runLoungeLayerTest, 80);
        }
      }

      function applyActivityRotation() {
        if (output !== 'lounge') return;
        const elapsed = Date.now() - state.activityRotationStartedAt;
        const chat = sceneEl.querySelector('[data-tenant-widget="sw-featured-chat"]');
        const leaderboard = sceneEl.querySelector('[data-tenant-widget="community-lounge-leaderboard-v2"], [data-tenant-widget="community-lounge-leaderboard"]');
        const legacyLeaderboard = sceneEl.querySelector('[data-tenant-widget="sw-leaderboard-command"]');
        if (legacyLeaderboard) {
          legacyLeaderboard.style.display = 'none';
          legacyLeaderboard.style.visibility = 'hidden';
          legacyLeaderboard.style.opacity = '0';
          legacyLeaderboard.setAttribute('aria-hidden', 'true');
        }
        const command = sceneEl.querySelector('[data-tenant-widget="sw-command-card"]');
        const surfaces = [
          ['chat', chat],
          ['leaderboard', leaderboard],
          ['command', command],
        ].filter(([, element]) => Boolean(element));
        const activeIndex = state.nebulaActivityActive || !surfaces.length
          ? -1
          : Math.floor(elapsed / 30000) % surfaces.length;
        surfaces.forEach(([name, element], index) => {
          const visible = index === activeIndex;
          element.classList.toggle('activity-idle-off', !visible);
          element.style.display = visible ? 'block' : 'none';
          element.style.visibility = visible ? 'visible' : 'hidden';
          element.style.opacity = visible ? '1' : '0';
          element.setAttribute('aria-hidden', visible ? 'false' : 'true');
        });
        sceneEl.dataset.activityIdlePhase = activeIndex >= 0 ? surfaces[activeIndex][0] : 'game';
      }

      function placeLoungeProgram(element, slot) {
        if (!element) return;
        const slots = {
          main: { left: 2.5, top: 4.5, width: 667, height: 362 },
          media: { left: 75.5, top: 14.5, width: 211, height: 130 },
        };
        const target = slots[slot];
        element.classList.add('lounge-program-swap');
        element.style.left = `${target.left}%`;
        element.style.top = `${target.top}%`;
        element.style.width = `${target.width}px`;
        element.style.height = `${target.height}px`;
      }

      function applyLoungeMediaLayout() {
        if (output !== 'lounge' || tenant !== 'mtman1987') return;
        const stream = sceneEl.querySelector('[data-tenant-widget="community-lounge-live-spotlight"]');
        const media = sceneEl.querySelector('[data-tenant-widget="community-lounge-hmo-media"]');
        const commercial = sceneEl.querySelector('[data-tenant-widget="community-lounge-commercial"]');
        const brb = sceneEl.querySelector('[data-tenant-widget="community-lounge-brb"]');
        if (commercial) {
          commercial.style.visibility = state.commercialBreakActive && commercialGifReady ? 'visible' : 'hidden';
          commercial.style.opacity = state.commercialBreakActive && commercialGifReady ? '1' : '0';
          commercial.style.pointerEvents = 'none';
        }
        // BRB covers only the program window. Alerts, games, Stella and the
        // neon frame keep their own layers above the fallback.
        placeLoungeProgram(brb, 'main');
        if (brb) {
          brb.style.zIndex = '80';
          // A saved widget opacity must not fade a full-screen BRB clip.
          // When BRB is off its iframe stays mounted but cannot cover Spotlight.
          brb.style.opacity = '1';
          brb.style.visibility = state.brbMode === 'off' ? 'hidden' : 'visible';
          const brbHasTransparentPlayer = state.brbMode === 'stream' || state.brbMode === 'vod';
          brb.style.pointerEvents = brbHasTransparentPlayer ? 'none' : '';
          const brbFrame = brb.querySelector('iframe');
          if (brbFrame) brbFrame.style.pointerEvents = brbHasTransparentPlayer ? 'none' : '';
        }
        // Twitch requires a full-size visible embed for muted autoplay. Keep
        // the persistent Spotlight player in the main slot during BRB streams.
        const mediaIsMain = state.loungeMediaMode === 'media' && state.brbMode !== 'stream' && state.brbMode !== 'vod';
        const spotlightSlot = mediaIsMain ? 'media' : 'main';
        placeLoungeProgram(stream, spotlightSlot);
        placeLoungeProgram(commercial, spotlightSlot);
        placeLoungeProgram(media, mediaIsMain ? 'main' : 'media');
        if (commercial) {
          const spotlightZ = Number.parseInt(stream?.style.zIndex || '0', 10);
          commercial.style.zIndex = String((Number.isFinite(spotlightZ) ? spotlightZ : 0) + 1);
        }
        // Keep the main program at its selected volume while the smaller
        // program plays quietly in the background. No iframe is remounted.
        for (const [element, focused] of [[stream, !mediaIsMain], [media, mediaIsMain]]) {
          const frame = element?.querySelector('iframe');
          if (frame) frame.contentWindow?.postMessage(
            { type: 'spmt-lounge-program-focus', focused }, new URL(frame.src).origin);
        }
        // Both program sources stay mounted and active. BRB/GIF content is an
        // overlay only; never hide or remount Spotlight, because a Twitch
        // preroll must be allowed to finish on the same persistent session.
        if (stream) stream.style.visibility = 'visible';
      }

      async function refreshLoungeMediaLayout() {
        if (output !== 'lounge' || tenant !== 'mtman1987') return;
        try {
          const response = await fetch('https://streamweaver-new.fly.dev/api/lounge/media-layout', { cache: 'no-store' });
          if (!response.ok) return;
          const payload = await response.json();
          const nextMode = payload?.mode === 'media' ? 'media' : 'stream';
          if (nextMode === state.loungeMediaMode) return;
          state.loungeMediaMode = nextMode;
          applyLoungeMediaLayout();
        } catch {
          // Preserve the last good arrangement through a temporary service miss.
        }
      }

      let commercialGifReady = false;
      let commercialActiveUntil = 0;
      let commercialExpiry;
      let spotlightDelayMs = 60000;
      function reportCommercialVisibility() {
        const frame = sceneEl.querySelector('[data-tenant-widget="community-lounge-commercial"] iframe');
        frame?.contentWindow?.postMessage({ type: 'spmt-commercial-visibility', visible: state.commercialBreakActive && commercialGifReady, activeUntil: commercialActiveUntil }, new URL(frame.src).origin);
      }
      window.addEventListener('message', event => {
        const frame = sceneEl.querySelector('[data-tenant-widget="community-lounge-commercial"] iframe');
        if (!frame || event.source !== frame.contentWindow || event.origin !== new URL(frame.src).origin || event.data?.type !== 'spmt-commercial-ready') return;
        const ready = event.data.ready === true;
        if (ready !== commercialGifReady) { commercialGifReady = ready; applyLoungeMediaLayout(); }
        reportCommercialVisibility();
      });
      window.addEventListener('message', (event) => {
        const spotlight = sceneEl.querySelector('[data-tenant-widget="community-lounge-live-spotlight"] iframe');
        if (!spotlight || event.source !== spotlight.contentWindow || event.origin !== new URL(spotlight.src).origin
          || event.data?.type !== 'spmt-lounge-spotlight-delay') return;
        const delay = Number(event.data.delayMs);
        if (!Number.isFinite(delay) || delay < 12000 || delay > 300000) return;
        spotlightDelayMs = delay;
        const commercial = sceneEl.querySelector('[data-tenant-widget="community-lounge-commercial"] iframe');
        commercial?.contentWindow?.postMessage({ type: 'spmt-lounge-spotlight-delay', delayMs: delay }, new URL(commercial.src).origin);
      });
      async function refreshCommercialBreakState() {
        if (output !== 'lounge' || tenant !== 'mtman1987') return;
        try {
          const response = await fetch(`https://streamweaver-new.fly.dev/api/lounge/commercial-break?playbackDelayMs=${Math.round(spotlightDelayMs)}`, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
          if (!response.ok) throw new Error('Commercial state unavailable');
          const payload = await response.json();
          commercialActiveUntil = Number(payload?.activeUntil || 0);
          clearTimeout(commercialExpiry);
          commercialExpiry = setTimeout(() => { state.commercialBreakActive = false; applyLoungeMediaLayout(); reportCommercialVisibility(); }, Math.max(0, commercialActiveUntil - Date.now()));
          const active = payload?.phase === 'ACTIVE' && Date.now() < Number(payload?.activeUntil || 0);
          if (active === state.commercialBreakActive) { reportCommercialVisibility(); return; }
          state.commercialBreakActive = active;
          applyLoungeMediaLayout();
          reportCommercialVisibility();
        } catch {
          reportCommercialVisibility();
          // Fail closed: never let an idle/erroring commercial iframe cover the program.
          if (state.commercialBreakActive) {
            state.commercialBreakActive = false;
            applyLoungeMediaLayout();
            reportCommercialVisibility();
          }
        }
      }

      // Stella can also request an isolated remount of only the HearMeOut media
      // iframe. This leaves Spotlight and the worker-owned movie/session untouched.
      let loungeMediaRestartSeen = null;
      let loungeMediaRestartBusy = false;
      let loungeMediaStuckSince = 0;
      let loungeMediaLastAutoRemount = 0;
      async function refreshLoungeMediaPlayer() {
        if (output !== 'lounge' || tenant !== 'mtman1987' || loungeMediaRestartBusy) return;
        loungeMediaRestartBusy = true;
        try {
          const frame = sceneEl.querySelector('[data-tenant-widget="community-lounge-hmo-media"] iframe');
          if (frame) {
            let stuck = false;
            try {
              const innerStatus = frame.contentDocument?.querySelector('#status');
              stuck = innerStatus && !innerStatus.hidden && /connecting to lounge worker/i.test(innerStatus.textContent || '');
            } catch {}
            if (stuck) {
              if (!loungeMediaStuckSince) loungeMediaStuckSince = Date.now();
              if (Date.now() - loungeMediaStuckSince >= 5000 && Date.now() - loungeMediaLastAutoRemount >= 15000) {
                loungeMediaLastAutoRemount = Date.now();
                loungeMediaStuckSince = 0;
                const url = new URL(frame.src);
                url.searchParams.set('player-restart', String(loungeMediaLastAutoRemount));
                frame.src = url.href;
                return;
              }
            } else {
              loungeMediaStuckSince = 0;
            }
          }
          const response = await fetch('https://streamweaver-new.fly.dev/api/lounge/media-player-restart', { cache: 'no-store' });
          if (!response.ok) return;
          const payload = await response.json();
          const requestedAt = Number(payload?.requestedAt) || 0;
          if (loungeMediaRestartSeen === null) {
            loungeMediaRestartSeen = requestedAt;
            return;
          }
          if (requestedAt <= loungeMediaRestartSeen) return;
          const restartFrame = sceneEl.querySelector('[data-tenant-widget="community-lounge-hmo-media"] iframe');
          if (!restartFrame) return;
          loungeMediaRestartSeen = requestedAt;
          const url = new URL(restartFrame.src);
          url.searchParams.set('player-restart', String(requestedAt));
          restartFrame.src = url.href;
        } catch {
          // Retry on the next poll; never touch Spotlight or reload the Lounge.
        } finally {
          loungeMediaRestartBusy = false;
        }
      }

      // Stella's chat action requests one reload of the Lounge Browser Source.
      // Remember the last request before reloading so this page cannot loop.
      let loungeRefreshSeen = null;
      let loungeRefreshBusy = false;
      async function refreshLoungeBrowserSource() {
        if (output !== 'lounge' || tenant !== 'mtman1987' || loungeRefreshBusy) return;
        loungeRefreshBusy = true;
        try {
          const response = await fetch('https://streamweaver-new.fly.dev/api/lounge/browser-refresh', { cache: 'no-store' });
          if (!response.ok) return;
          const payload = await response.json();
          const requestedAt = Number(payload?.requestedAt) || 0;
          if (loungeRefreshSeen === null) {
            loungeRefreshSeen = requestedAt;
            return;
          }
          if (requestedAt <= loungeRefreshSeen) return;
          // Keep the current picture through a spmt-live outage. Retry this
          // request when its page host is healthy enough to serve the reload.
          const health = await fetch('/api/health', {
            cache: 'no-store',
            signal: typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(5000) : undefined,
          });
          if (!health.ok) return;
          loungeRefreshSeen = requestedAt;
          location.reload();
        } catch {
          // Retry on the next poll without reloading a healthy source.
        } finally {
          loungeRefreshBusy = false;
        }
      }

      function xboxWidget() {
        if (state.layout.enabled === false) return null;
        return (state.layout.widgets || []).find((widget) => widget.kind === 'xbox' && widget.visible !== false) || null;
      }

      function xboxElement() {
        return sceneEl.querySelector('.tenant-widget.kind-xbox');
      }

      function xboxImage() {
        return sceneEl.querySelector('[data-tenant-xbox-frame]');
      }

      function applyXboxVisibility() {
        const element = xboxElement();
        if (!element) return;
        element.style.visibility = state.xboxStatusKnown && state.xboxRunning ? 'visible' : 'hidden';
      }

      function clearXboxFrame() {
        const image = xboxImage();
        if (image) image.removeAttribute('src');
        if (state.lastFrameUrl) {
          URL.revokeObjectURL(state.lastFrameUrl);
          state.lastFrameUrl = '';
        }
      }

      async function sceneRequest() {
        const url = `/api/tenant/${encodeURIComponent(tenant)}/${output}`;
        const response = await fetch(url, { credentials: 'include', cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`scene ${response.status}`);
        return response.json();
      }

      async function refreshScene() {
        try {
          const data = await sceneRequest();
          const layout = contract.normalizeLayout(data.layout);
          const signature = JSON.stringify(layout);
          state.xboxRelayToken = output === 'public' || output === 'lounge' ? String(data.xboxRelayToken || state.xboxRelayToken || '') : '';
          if (signature !== state.signature) {
            state.layout = layout;
            state.signature = signature;
            renderScene();
          } else {
            state.layout = layout;
          }
        } catch {
          // A renderer failure must not paint a login page or SPMT chrome over the broadcaster. Stay transparent/last-known.
        }
      }

      function xboxHeaders() {
        return output === 'public' && state.xboxRelayToken ? { Authorization: `Bearer ${state.xboxRelayToken}` } : {};
      }

      function xboxApiPath(kind) {
        if (output === 'public') return kind === 'status' ? '/api/tenant-xbox/status' : '/api/tenant-xbox/frame';
        return kind === 'status' ? '/api/cloud-xbox/status' : '/api/cloud-xbox/frame';
      }

      async function refreshXboxStatus() {
        if (!xboxWidget()) {
          state.xboxStatusKnown = true;
          state.xboxRunning = false;
          clearXboxFrame();
          applyXboxVisibility();
          return;
        }
        if (output === 'public' && !state.xboxRelayToken) return;
        try {
          const response = await fetch(xboxApiPath('status'), {
            credentials: 'include', cache: 'no-store', headers: { Accept: 'application/json', ...xboxHeaders() },
          });
          if (!response.ok) return;
          const data = await response.json();
          const wasRunning = state.xboxRunning;
          state.xboxStatusKnown = true;
          state.xboxRunning = Boolean(data?.running);
          applyXboxVisibility();
          if (wasRunning && !state.xboxRunning) clearXboxFrame();
        } catch {
          // Keep last known live state through a transport miss.
        }
      }

      async function refreshXboxFrame() {
        if (state.frameBusy || !xboxWidget() || !state.xboxStatusKnown || !state.xboxRunning) return;
        if (output === 'public' && !state.xboxRelayToken) return;
        const image = xboxImage();
        if (!image) return;
        state.frameBusy = true;
        try {
          const response = await fetch(`${xboxApiPath('frame')}?t=${Date.now()}`, {
            credentials: 'include', cache: 'no-store', headers: xboxHeaders(),
          });
          if (!response.ok) return;
          const blob = await response.blob();
          if (!blob.type.startsWith('image/')) return;
          const objectUrl = URL.createObjectURL(blob);
          const probe = new Image();
          probe.onload = () => {
            const previous = state.lastFrameUrl;
            state.lastFrameUrl = objectUrl;
            image.src = objectUrl;
            if (previous) URL.revokeObjectURL(previous);
          };
          probe.onerror = () => URL.revokeObjectURL(objectUrl);
          probe.src = objectUrl;
        } catch {
          // Keep the last good frame while Xbox still reports running.
        } finally {
          state.frameBusy = false;
        }
      }

      function runLoungeLayerTest() {
        const widgets = state.layout.widgets || [];
        document.querySelectorAll('[data-tenant-widget]').forEach((element) => {
          const id = element.getAttribute('data-tenant-widget') || '';
          const widget = widgets.find((item) => item.id === id) || (id === DEFAULT_ALERT_WIDGET.id ? DEFAULT_ALERT_WIDGET : null);
          const marker = document.createElement('div');
          marker.className = 'tenant-test-marker';
          const label = document.createElement('span');
          label.textContent = widget
            ? `${widget.title || widget.id} · ${widget.kind || 'source'}${widget.role ? ` · ${widget.role}` : ''}`
            : id;
          marker.appendChild(label);
          element.appendChild(marker);
        });
        fireAlert({
          eventType: 'custom',
          headline: 'Lounge layer test',
          message: 'Alerts and every saved Lounge layer are present.',
        });
        setTimeout(() => {
          document.querySelectorAll('.tenant-test-marker').forEach((marker) => marker.remove());
        }, 10_000);
      }

      function fireAlert(rawPayload = {}) {
        const payload = normalizeAlert(rawPayload);
        document.querySelectorAll('[data-tenant-alert]').forEach((stage) => {
          const alertId = stage.dataset.tenantAlert;
          const widget = (state.layout.widgets || []).find((item) => item.id === alertId)
            || (alertId === DEFAULT_ALERT_WIDGET.id ? DEFAULT_ALERT_WIDGET : null);
          if (!widget || widget.visible === false) return;
          const accepts = widget.accepts || Object.keys(ALERT_TEMPLATES);
          if (!accepts.includes(payload.eventType) && !accepts.includes('custom')) return;
          const templates = widget.templates || ALERT_TEMPLATES;
          const template = templates[payload.eventType] || templates.custom || ALERT_TEMPLATES.custom;
          const headline = applyTokens(template.headline, payload) || payload.headline;
          const body = applyTokens(template.body, payload) || payload.message;
          const imageUrl = payload.imageUrl || widget.imageUrl || '';
          stage.style.setProperty('--alert-accent', widget.accent || '#f97316');
          const image = stage.querySelector('[data-alert-image]');
          if (image) {
            image.src = imageUrl;
            image.hidden = !imageUrl;
          }
          stage.querySelector('[data-alert-headline]')?.replaceChildren(document.createTextNode(headline));
          stage.querySelector('[data-alert-body]')?.replaceChildren(document.createTextNode(body));
          stage.classList.remove('is-showing');
          void stage.offsetWidth;
          stage.classList.add('is-showing');
          clearTimeout(state.alertTimers.get(widget.id));
          state.alertTimers.set(widget.id, setTimeout(() => stage.classList.remove('is-showing'), Math.max(1500, Number(widget.durationMs) || 6500)));
        });
      }

      window.spmtOverlayAlert = fireAlert;
      window.addEventListener('spmt:overlay-alert', (event) => fireAlert(event.detail || {}));
      window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (data.type === 'nebula.activity-state' && output === 'lounge' && tenant === 'mtman1987') {
          const nebula = sceneEl.querySelector('[data-tenant-widget="community-lounge-nebula-stage"] iframe');
          if (!nebula || event.source === nebula.contentWindow) {
            state.nebulaActivityActive = data.active === true;
            applyActivityRotation();
          }
          return;
        }
        if (event.source === window || event.origin === location.origin) {
          if (data.type === 'spmt.overlay.alert' || data.type === 'spacemountain.alert') fireAlert(data);
        }
      });

      window.addEventListener('resize', resizeScene);
      window.addEventListener('beforeunload', clearXboxFrame);
      if (typeof ResizeObserver === 'function') new ResizeObserver(resizeScene).observe(wrapEl);

      resizeScene();
      if (spotlightInteractMode) document.documentElement.dataset.spotlightInteract = 'true';
      try { window.parent.postMessage({ type: 'spmt.personal.renderer-ready', tenant, output }, '*'); } catch {}
      refreshScene().then(() => Promise.all([refreshXboxStatus(), refreshLoungeMediaLayout(), refreshCommercialBreakState()]));
      void refreshMasterVolume();
      setInterval(refreshScene, 2000);
      setInterval(refreshMasterVolume, 3000);
      setInterval(applyActivityRotation, 1000);
      setInterval(refreshLoungeMediaLayout, 2500);
      setInterval(refreshCommercialBreakState, 1000);
      void refreshLoungeMediaPlayer();
      setInterval(refreshLoungeMediaPlayer, 2500);
      void refreshLoungeBrowserSource();
      setInterval(refreshLoungeBrowserSource, 2500);
      setTimeout(retryLiveCards, 15000);
      setInterval(retryLiveCards, 20000);
      setInterval(retryUnloadedPlayerFrames, 5000);
      setInterval(refreshXboxStatus, 1000);
      setInterval(refreshXboxFrame, 500);
    })();
  </script>
</body>
</html>
